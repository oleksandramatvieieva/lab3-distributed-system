services:
  - type: web
    name: lab3-rest-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. lab3.proto
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
